name: Gerar cobrinha das contribuições

on:
  schedule:
    # Atualiza a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A cobrinha come o gráfico de contribuições da conta Joojizitos65,
      # que concentra a maior parte dos repositórios.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Joojizitos65
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publica os SVGs na branch "output", que o README usa como imagem.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
